<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" role="img" aria-labelledby="title desc">
  <title id="title">Walking girl in a white embroidered outfit</title>
  <desc id="desc">A soft, hand-illustrated character inspired by the supplied outfit: dark hair tied back, a white embroidered kurta, white flowing skirt and a pale dupatta.</desc>
  <defs>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".48" stop-color="#f4eee8"/>
      <stop offset="1" stop-color="#ded5d0"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffdfb"/>
      <stop offset=".6" stop-color="#f4efeb"/>
      <stop offset="1" stop-color="#dcd4d0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9b99f"/>
      <stop offset="1" stop-color="#c98e79"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30201f"/>
      <stop offset="1" stop-color="#120f12"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <ellipse cx="120" cy="459" rx="54" ry="8" fill="#3d261f" opacity=".16" filter="url(#softShadow)"/>

  <!-- rear hair and tied bun -->
  <g id="hair">
    <path d="M82 56 C76 28 95 12 120 14 C146 14 163 33 157 65 C153 91 146 109 133 116 L89 105 C79 91 76 74 82 56Z" fill="url(#hair)"/>
    <circle cx="153" cy="29" r="17" fill="#211719"/>
    <path d="M143 22 C151 9 166 15 168 28 C164 39 153 43 145 35Z" fill="#392324"/>
  </g>

  <!-- legs: independently animated -->
  <g id="left-leg" class="leg leg-left">
    <path d="M103 337 C99 370 94 407 91 445 L108 448 C119 414 125 378 128 342Z" fill="url(#skin)"/>
    <path d="M90 442 C82 448 76 458 80 464 C89 469 108 467 116 462 L109 447Z" fill="#e8d6cc"/>
    <path d="M83 460 Q98 466 115 460" fill="none" stroke="#c99e91" stroke-width="2"/>
  </g>
  <g id="right-leg" class="leg leg-right">
    <path d="M128 337 C134 369 143 405 151 445 L168 441 C165 402 157 365 151 335Z" fill="url(#skin)"/>
    <path d="M148 440 C143 449 145 461 154 464 C164 467 181 462 183 455 L169 440Z" fill="#ead9d0"/>
    <path d="M151 458 Q166 464 181 454" fill="none" stroke="#c99e91" stroke-width="2"/>
  </g>

  <!-- flowing lower garment -->
  <g id="skirt">
    <path d="M91 263 C79 306 67 370 57 438 Q118 462 187 438 C177 374 163 306 151 263Z" fill="url(#skirt)" stroke="#d9d0cb" stroke-width="2"/>
    <path d="M111 278 C108 334 109 390 105 449" fill="none" stroke="#d6ccc7" stroke-width="2" opacity=".7"/>
    <path d="M145 280 C151 341 158 398 166 447" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
    <path d="M62 433 Q120 450 184 433" fill="none" stroke="#cfc4bf" stroke-width="2"/>
  </g>

  <!-- arms behind kurta -->
  <g id="left-arm" class="arm arm-left">
    <path d="M88 150 C69 177 63 219 66 258 L79 266 C91 235 98 193 107 166Z" fill="url(#skin)"/>
    <path d="M65 251 Q58 266 65 277 Q74 282 80 269 L79 255Z" fill="url(#skin)"/>
  </g>
  <g id="right-arm" class="arm arm-right">
    <path d="M151 150 C173 177 179 219 175 258 L162 266 C150 235 143 193 134 166Z" fill="url(#skin)"/>
    <path d="M175 251 Q183 266 175 277 Q166 282 161 269 L162 255Z" fill="url(#skin)"/>
  </g>

  <!-- kurta body with pointed embroidered hem -->
  <g id="kurta">
    <path d="M91 115 Q120 105 149 115 L168 153 L190 274 L157 310 L120 279 L83 310 L50 274 L72 153Z"
      fill="url(#fabric)" stroke="#d6cbc5" stroke-width="2"/>
    <path d="M91 116 Q120 132 149 116 L143 145 Q120 157 97 145Z" fill="#f7f1ed" stroke="#d8cec8"/>
    <path d="M91 116 Q120 134 149 116" fill="none" stroke="#cfc4bf" stroke-width="2"/>
    <path d="M75 160 L59 271 M165 160 L181 271" stroke="#fff" stroke-width="5" opacity=".65"/>
    <!-- subtle floral embroidery -->
    <g fill="none" stroke="#d9b8b2" stroke-width="1.7" opacity=".9">
      <path d="M79 188 q-9 -8 -3 -14 q8 -4 9 6 q7 -8 12 -1 q2 8 -8 9 q8 8 1 13 q-8 1 -9 -8 q-7 8 -12 1 q-1 -7 10 -6Z"/>
      <path d="M151 187 q-8 -8 -2 -14 q8 -4 9 6 q7 -8 12 -1 q2 8 -8 9 q8 8 1 13 q-8 1 -9 -8 q-7 8 -12 1 q-1 -7 9 -6Z"/>
      <path d="M119 218 q-8 -8 -2 -14 q8 -4 9 6 q7 -8 12 -1 q2 8 -8 9 q8 8 1 13 q-8 1 -9 -8 q-7 8 -12 1 q-1 -7 9 -6Z"/>
      <path d="M83 250 q-7 -7 -2 -12 q7 -3 8 5 q6 -7 10 -1 q2 7 -7 8 q7 7 1 11 q-7 1 -8 -7 q-6 7 -11 1 q-1 -6 9 -5Z"/>
      <path d="M151 250 q-7 -7 -2 -12 q7 -3 8 5 q6 -7 10 -1 q2 7 -7 8 q7 7 1 11 q-7 1 -8 -7 q-6 7 -11 1 q-1 -6 9 -5Z"/>
    </g>
    <g fill="#d9a8a5">
      <circle cx="85" cy="196" r="2"/><circle cx="157" cy="195" r="2"/>
      <circle cx="125" cy="226" r="2"/><circle cx="88" cy="258" r="2"/><circle cx="156" cy="258" r="2"/>
    </g>
    <path d="M120 150 L120 278" stroke="#ded4ce" stroke-width="1.5" stroke-dasharray="3 5"/>
  </g>

  <!-- dupatta draped around neck -->
  <g id="dupatta">
    <path d="M94 110 Q120 129 147 109 L157 124 Q143 145 120 145 Q97 145 83 124Z"
      fill="#f0e9e7" stroke="#d4c8c4" stroke-width="2"/>
    <path d="M86 124 Q102 144 120 142 Q139 144 154 123" fill="none" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- neck and face -->
  <path d="M108 89 L108 116 Q120 127 132 116 L132 89Z" fill="url(#skin)"/>
  <path d="M87 58 Q88 30 120 29 Q151 30 153 59 L148 91 Q141 113 120 116 Q99 113 91 91Z" fill="url(#skin)"/>
  <!-- face framing hair -->
  <path d="M84 66 C79 30 101 18 123 20 C149 20 161 40 154 72 L147 62 Q141 46 128 44 Q109 49 96 43 Q94 59 87 76Z" fill="url(#hair)"/>
  <path d="M91 67 Q88 91 99 104" fill="none" stroke="#211719" stroke-width="5" stroke-linecap="round"/>
  <path d="M148 63 Q153 86 141 103" fill="none" stroke="#211719" stroke-width="4" stroke-linecap="round"/>
  <!-- facial features -->
  <path d="M101 75 Q108 71 114 75 M127 75 Q134 71 140 75" fill="none" stroke="#49312c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="108" cy="79" rx="2.3" ry="2.7" fill="#302322"/>
  <ellipse cx="134" cy="79" rx="2.3" ry="2.7" fill="#302322"/>
  <path d="M120 80 Q116 91 121 92" fill="none" stroke="#b77d70" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112 100 Q120 105 128 99" fill="none" stroke="#9d5e5b" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="101" cy="91" rx="6" ry="3" fill="#d98788" opacity=".25"/>
  <ellipse cx="139" cy="91" rx="6" ry="3" fill="#d98788" opacity=".25"/>
  <path d="M120 39 L120 44" stroke="#b77d70" stroke-width="1.2"/>
  <circle cx="120" cy="45" r="1.6" fill="#c28b79"/>

  <!-- small neckline and sleeve details -->
  <path d="M73 153 Q84 165 95 159 M145 159 Q157 165 167 153" fill="none" stroke="#d4c9c4" stroke-width="2"/>
  <g fill="#d7a9a4">
    <circle cx="100" cy="169" r="2"/><circle cx="140" cy="169" r="2"/>
    <circle cx="120" cy="184" r="2"/>
  </g>

  <style>
    .leg-left { transform-box: fill-box; transform-origin: 50% 8%; animation: leftStep .48s ease-in-out infinite alternate; }
    .leg-right { transform-box: fill-box; transform-origin: 50% 8%; animation: rightStep .48s ease-in-out infinite alternate; }
    .arm-left { transform-box: fill-box; transform-origin: 50% 8%; animation: leftArm .48s ease-in-out infinite alternate; }
    .arm-right { transform-box: fill-box; transform-origin: 50% 8%; animation: rightArm .48s ease-in-out infinite alternate; }
    #skirt { transform-box: fill-box; transform-origin: 50% 10%; animation: skirtSway .48s ease-in-out infinite alternate; }
    #kurta { transform-box: fill-box; transform-origin: 50% 10%; animation: bodyBounce .48s ease-in-out infinite alternate; }
    #dupatta { transform-box: fill-box; transform-origin: 50% 10%; animation: dupattaSway .7s ease-in-out infinite alternate; }
    @keyframes leftStep { from { transform: rotate(13deg); } to { transform: rotate(-13deg); } }
    @keyframes rightStep { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
    @keyframes leftArm { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    @keyframes rightArm { from { transform: rotate(9deg); } to { transform: rotate(-9deg); } }
    @keyframes skirtSway { from { transform: rotate(-1.8deg) translateY(0); } to { transform: rotate(1.8deg) translateY(2px); } }
    @keyframes bodyBounce { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    @keyframes dupattaSway { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }
    @media (prefers-reduced-motion: reduce) {
      .leg-left, .leg-right, .arm-left, .arm-right, #skirt, #kurta, #dupatta { animation: none; }
    }
  </style>
</svg>
